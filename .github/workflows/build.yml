name: Build test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    # Catches upstream dds-bridge/dds breakage even with no local
    # changes - exactly the scenario that prompted this workflow.
    - cron: '0 6 * * 1'  # every Monday, 06:00 UTC
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build
        run: |
          chmod +x build.sh build_bench.sh
          ./build.sh
          ./build_bench.sh

      - name: Smoke test - known deal, exact expected output
        run: |
          cat > /tmp/smoke_prefix.js << 'EOF'
          var Module = {
            instantiateWasm: function (imports, successCallback) {
              var fs = require('fs');
              var path = require('path');
              var wasmBinary = fs.readFileSync(path.join(__dirname, 'dds.wasm'));
              WebAssembly.instantiate(wasmBinary, imports).then(function (result) {
                successCallback(result.instance, result.module);
              });
              return {};
            },
            onRuntimeInitialized: function () {
              var fn = Module.cwrap('handleDDSRequest', 'string',
                ['string','string','string','string','string','string','string','string','string','string']);
              var deal = 'N:QJ6.K652.J85.T98x873.J97.AT764.Q4xK5.T83.KQ9.A7652xAT942.AQ4.32.KJ3';
              var res = fn(deal, 'S', 'm', 'x', 'None', 'x', '00000000000000000000', 'ci', 'x', 'x');
              console.log(res);
              var expected = '"ddtricks":"65657656576867568675"';
              if (res.indexOf(expected) === -1) {
                console.error('Smoke test FAILED: expected substring not found:', expected);
                process.exit(1);
              }
              console.log('Smoke test passed.');
            }
          };
          EOF
          cat /tmp/smoke_prefix.js out/dds.js > out/smoke_combined.js
          node out/smoke_combined.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dds-wasm-build
          path: |
            out/dds.js
            out/dds.wasm

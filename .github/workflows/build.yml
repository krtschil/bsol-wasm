name: Build test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    # Catches upstream dds-bridge/dds breakage even with no local
    # changes - exactly the scenario that prompted this workflow.
    - cron: '0 6 * * 1'  # every Monday, 06:00 UTC
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build
        run: |
          chmod +x build.sh build_bench.sh
          ./build.sh
          ./build_bench.sh

      - name: Smoke test - known deal, exact expected output
        run: |
          node -e "
          const vm = require('vm');
          const fs = require('fs');
          const context = { console, require, __dirname, __filename, process, Buffer, TextDecoder, TextEncoder, setTimeout, clearTimeout, WebAssembly };
          context.global = context; context.globalThis = context;
          vm.createContext(context);
          context.Module = {
            wasmBinary: fs.readFileSync('./out/dds.wasm'),
            onRuntimeInitialized: function() {
              const fn = context.Module.cwrap('handleDDSRequest','string',
                ['string','string','string','string','string','string','string','string','string','string']);
              const deal = 'N:QJ6.K652.J85.T98x873.J97.AT764.Q4xK5.T83.KQ9.A7652xAT942.AQ4.32.KJ3';
              const res = fn(deal, 'S', 'm', 'x', 'None', 'x', '00000000000000000000', 'ci', 'x', 'x');
              console.log(res);
              const expected = '\"ddtricks\":\"65657656576867568675\"';
              if (!res.includes(expected)) {
                console.error('Smoke test FAILED: expected substring not found:', expected);
                process.exit(1);
              }
              console.log('Smoke test passed.');
            }
          };
          vm.runInContext(fs.readFileSync('./out/dds.js','utf8'), context, { filename: 'dds.js' });
          "

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dds-wasm-build
          path: |
            out/dds.js
            out/dds.wasm
